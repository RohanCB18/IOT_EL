camera:
  source: 0                    # 0 = webcam, or "test_videos/crowd.mp4"
  resolution: [320, 240]

detection:
  model_path: "yolov8n.pt"
  confidence: 0.45
  imgsz: 320

density:
  eps: 50
  min_samples: 3
  pixels_per_meter: 100
  sigma: 30

risk:
  weights: [0.40, 0.20, 0.25, 0.15]   # density, speed, compression, chaos
  warning_threshold: 0.55
  critical_threshold: 0.75
  window_size: 10

mqtt:
  broker: "broker.hivemq.com"
  port: 1883
  topics:
    metrics: "oracle_rohan_123/node1/metrics"
    heatmap: "oracle_rohan_123/node1/heatmap"
    actuation: "oracle_rohan_123/node1/actuation"
    alert: "oracle_rohan_123/node1/alert"
    camera: "oracle_rohan_123/node1/camera"
