profiles:
  "0": # Webcam
    camera:
      source: 0
      resolution: [640, 480]
    detection:
      backend: "peoplenet"
      peoplenet_model_path: "models/resnet34_peoplenet.onnx"
      peoplenet_confidence: 0.40
      peoplenet_nms: 0.50
      model_path: "yolov8s.pt"
      confidence: 0.15
      imgsz: 640
    density:
      eps: 50
      min_samples: 3
      pixels_per_meter: 100
      sigma: 30
    risk:
      weights: [0.40, 0.20, 0.25, 0.15]
      warning_threshold: 0.45
      critical_threshold: 0.65
      window_size: 10
      smoothing_alpha: 0.2
      hysteresis_margin: 0.05
      actuator_cooldown_s: 5.0
    mqtt:
      broker: "broker.hivemq.com"
      port: 1883
      topics:
        metrics: "oracle_rohan_123/node1/metrics"
        heatmap: "oracle_rohan_123/node1/heatmap"
        actuation: "oracle_rohan_123/node1/actuation"
        alert: "oracle_rohan_123/node1/alert"
        camera: "oracle_rohan_123/node1/camera"

