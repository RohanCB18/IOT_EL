camera:
  source: 0                    # 0 = webcam, or "test_videos/crowd.mp4"
  resolution: [640, 480]       # set to [320, 240] for RPi CPU-only mode

detection:
  # ── Backend selector ──────────────────────────────────────────────────────
  # "peoplenet" → NVIDIA PeopleNet ONNX (default, recommended)
  #               Requires: pip install onnxruntime-gpu  (CUDA 12.x + cuDNN 9.x)
  #               For CPU-only: pip install onnxruntime  (no -gpu suffix)
  # "yolo"      → YOLOv8 via ultralytics (fallback, works out of the box)
  backend: "peoplenet"

  # ── PeopleNet settings (active when backend = "peoplenet") ───────────────
  peoplenet_model_path: "models/resnet34_peoplenet.onnx"
  peoplenet_confidence: 0.40   # min confidence to keep a detection (0–1)
  peoplenet_nms: 0.50          # NMS IoU threshold (lower = more suppression)

  # ── YOLOv8 settings (active when backend = "yolo") ───────────────────────
  model_path: "yolov8n_ncnn_model"   # or yolov8s.pt / yolov8n.pt
  confidence: 0.45
  imgsz: 320

density:
  eps: 50
  min_samples: 3
  pixels_per_meter: 100        # calibrate: measure a known distance in camera FOV
  sigma: 30

risk:
  weights: [0.40, 0.20, 0.25, 0.15]   # density, speed, compression, chaos
  warning_threshold: 0.55
  critical_threshold: 0.75
  window_size: 10

mqtt:
  broker: "localhost"          # laptop dev: "localhost" | RPi deploy: "<RPi_IP>"
  port: 1883
  topics:
    metrics: "oracle/node1/metrics"
    heatmap: "oracle/node1/heatmap"
    actuation: "oracle/node1/actuation"
    alert: "oracle/node1/alert"
